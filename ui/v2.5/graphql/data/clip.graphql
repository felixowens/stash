fragment SlimClipData on Clip {
  id
  title
  details
  date
  rating100
  organized
  start_seconds
  end_seconds
  o_counter
  play_count
  scene {
    id
    title
  }
  paths {
    stream
    preview
    screenshot
  }
  studio {
    id
    name
    image_path
  }
  tags {
    id
    name
  }
  performers {
    id
    name
    gender
    favorite
    image_path
  }
  created_at
  updated_at
}

fragment ClipData on Clip {
  id
  title
  details
  date
  rating100
  organized
  start_seconds
  end_seconds
  o_counter
  last_played_at
  resume_time
  play_duration
  play_count
  play_history
  o_history

  scene {
    id
    title
    date
  }

  paths {
    stream
    preview
    screenshot
  }

  studio {
    ...SlimStudioData
  }
  tags {
    ...SlimTagData
  }
  performers {
    ...PerformerData
  }

  created_at
  updated_at
}

# the wall solves its layout from the source dimensions, which the slim
# fragment does not carry; everything else it needs is the stream + poster
fragment WallClipData on Clip {
  id
  title
  start_seconds
  end_seconds
  paths {
    # ClipPathsType has no id, so it is stored unnormalised under its parent —
    # select the same fields as SlimClipData or the cache warns on merge
    stream
    preview
    screenshot
  }
  scene {
    id
    title
    files {
      id
      width
      height
    }
  }
}

fragment SelectClipData on Clip {
  id
  title
  start_seconds
  end_seconds
  scene {
    id
    title
  }
  paths {
    screenshot
  }
}
